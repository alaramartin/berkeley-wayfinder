[project]
name = "wf-pipeline"
version = "0.1.0"
description = "Berkeley Wayfinder: placard photo -> floor graph proposal pipeline"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "scikit-image>=0.24",
  "pillow>=11.0",
  "pillow-heif>=0.20",
  "shapely>=2.0",
  "easyocr>=1.7",
  "torch>=2.5",        # pulled in by easyocr; pinned here so Linux/CI uses CPU wheels (see [tool.uv.sources])
  "torchvision>=0.20",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "typer>=0.15",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
]

[project.scripts]
wf = "wf.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.8",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
