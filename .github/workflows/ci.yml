name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: JSON Schema is up to date
        run: |
          pnpm --filter @wf/schema gen:jsonschema
          git diff --exit-code packages/schema/schema
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @wf/nav build
      - name: The field tool is not in the public build
        # /field exists only in builds made with NEXT_PUBLIC_FIELD_MODE=1 (the walk). The deployed site
        # is built without it, and must answer 404 for the page and its service worker.
        run: |
          pnpm --filter @wf/nav exec next start --port 3100 &
          sleep 8
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/wheeler)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/field)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/field-sw.js)" = 404

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest
